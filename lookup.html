<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOR LAB — Order Lookup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --accent: #C6FF33;
      --surface: #121212;
      --surface-2: #181818;
      --line: rgba(255, 255, 255, .1);
      --muted: #9a9a9a;
      --text: #fff
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080808;
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input {
      font: inherit
    }

    .container {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8, 8, 8, .86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, .06)
    }

    .topbar-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px
    }

    .brand {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #bdbdbd;
      font-size: 13px;
      font-weight: 700
    }

    .top-links a {
      transition: color .25s
    }

    .top-links a:hover {
      color: var(--accent)
    }

    main {
      padding: 56px 0 84px
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      align-items: end;
      gap: 28px;
      margin-bottom: 28px
    }

    .eyebrow {
      display: inline-block;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px
    }

    h1 {
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 900
    }

    .head-copy {
      color: var(--muted);
      font-size: 15px
    }

    .panel {
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    .lookup-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      padding: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, .07)
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    label {
      color: #cfcfcf;
      font-size: 13px;
      font-weight: 700
    }

    input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      color: #fff;
      padding: 14px 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(198, 255, 51, .12)
    }

    .lookup-button {
      border: 0;
      border-radius: 60px;
      background: var(--accent);
      color: #080808;
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
      padding: 15px 24px;
      min-height: 51px;
      white-space: nowrap;
      transition: transform .25s, box-shadow .25s, background .25s
    }

    .lookup-button:hover {
      background: #d4ff5a;
      box-shadow: 0 0 30px rgba(198, 255, 51, .24);
      transform: translateY(-2px)
    }

    .lookup-button:disabled {
      cursor: wait;
      opacity: .68;
      transform: none;
      box-shadow: none
    }

    .result-area {
      padding: 28px;
      display: grid;
      gap: 14px
    }

    .empty,
    .error,
    .hint {
      border-radius: 8px;
      padding: 18px;
      font-size: 14px
    }

    .hint {
      color: #d6d6d6;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .07)
    }

    .empty {
      color: #e6ff9a;
      background: rgba(198, 255, 51, .08);
      border: 1px solid rgba(198, 255, 51, .22)
    }

    .error {
      color: #ffb4b4;
      background: rgba(255, 75, 75, .08);
      border: 1px solid rgba(255, 75, 75, .22)
    }

    .order-card {
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      padding: 20px
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px
    }

    .program-name {
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.4
    }

    .order-id {
      color: #777;
      font-size: 12px;
      margin-top: 4px
    }

    .status {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 7px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 900
    }

    .status.pending {
      border-color: rgba(198, 255, 51, .35);
      color: var(--accent);
      background: rgba(198, 255, 51, .08)
    }

    .status.confirmed {
      border-color: rgba(92, 255, 158, .35);
      color: #8cffb9;
      background: rgba(92, 255, 158, .08)
    }

    .status.canceled {
      border-color: rgba(255, 75, 75, .28);
      color: #ffb4b4;
      background: rgba(255, 75, 75, .08)
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .meta {
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      padding: 12px
    }

    .meta-label {
      color: #777;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px
    }

    .meta-value {
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      word-break: keep-all
    }

    @media(max-width:800px) {
      .page-head,
      .lookup-form {
        grid-template-columns: 1fr
      }

      .lookup-button {
        width: 100%
      }

      .meta-grid {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:640px) {
      .container {
        width: min(100% - 28px, 920px)
      }

      main {
        padding-top: 36px
      }

      .topbar-inner {
        height: 64px
      }

      .top-links {
        gap: 12px
      }

      .lookup-form,
      .result-area {
        padding: 22px
      }
    }
  </style>
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="./index.html">AMOR LAB</a>
      <nav class="top-links" aria-label="상단 이동">
        <a href="./order.html">주문하기</a>
        <a href="./index.html#pricing">프로그램 보기</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <span class="eyebrow">Order Lookup</span>
          <h1>주문 확인</h1>
        </div>
        <p class="head-copy">주문할 때 입력한 이름과 연락처로 신청 내역을 확인할 수 있습니다.</p>
      </div>

      <section class="panel" aria-labelledby="lookupTitle">
        <form class="lookup-form" id="lookupForm">
          <div class="field">
            <label for="buyerName">이름</label>
            <input id="buyerName" name="buyerName" autocomplete="name" required placeholder="홍길동" />
          </div>
          <div class="field">
            <label for="buyerPhone">핸드폰 번호</label>
            <input id="buyerPhone" name="buyerPhone" autocomplete="tel" required placeholder="010-0000-0000" />
          </div>
          <button class="lookup-button" type="submit" id="lookupButton">조회하기</button>
        </form>

        <div class="result-area" id="resultArea">
          <div class="hint" id="lookupTitle">주문자 이름과 핸드폰 번호를 입력한 뒤 조회해 주세요.</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://sburksnwmywzytpctjws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidXJrc253bXl3enl0cGN0andzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDA4MDQsImV4cCI6MjA4NzUxNjgwNH0.AamszIdA3WYnGWl-vx1fjI70-QZM-59Ap8MzLAmNB8g';
    const TENANT_ID = '8e4f2364-ddd7-4e65-8238-6951d67b4c42';

    const formatPrice = value => new Intl.NumberFormat('ko-KR', {
      style: 'currency',
      currency: 'KRW',
      maximumFractionDigits: 0
    }).format(Number(value) || 0);

    const formatDate = value => {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    };

    const statusMeta = status => ({
      pending: { label: '입금 확인 대기', className: 'pending' },
      confirmed: { label: '확인 완료', className: 'confirmed' },
      canceled: { label: '취소됨', className: 'canceled' }
    }[status] || { label: status || '상태 확인 중', className: '' });

    function renderOrders(orders) {
      const resultArea = document.getElementById('resultArea');

      if (!orders.length) {
        resultArea.innerHTML = '<div class="empty">일치하는 주문 내역이 없습니다. 이름과 핸드폰 번호를 다시 확인해 주세요.</div>';
        return;
      }

      resultArea.innerHTML = orders.map(order => {
        const payload = order.order_payload || {};
        const status = statusMeta(order.status);
        const totalPrice = payload.totalPriceKrw || ((payload.monthlyPriceKrw || 0) * (payload.durationMonths || 1));

        return `
          <article class="order-card">
            <div class="order-top">
              <div>
                <div class="program-name">${payload.programName || 'AMOR 프로그램'}</div>
                <div class="order-id">주문번호 ${order.id || '-'}</div>
              </div>
              <span class="status ${status.className}">${status.label}</span>
            </div>
            <div class="meta-grid">
              <div class="meta">
                <div class="meta-label">결제 금액</div>
                <div class="meta-value">${formatPrice(totalPrice)}</div>
              </div>
              <div class="meta">
                <div class="meta-label">수강 기간</div>
                <div class="meta-value">${payload.durationMonths || '-'}개월</div>
              </div>
              <div class="meta">
                <div class="meta-label">주문 일시</div>
                <div class="meta-value">${formatDate(order.created_at)}</div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('lookupForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!event.currentTarget.reportValidity()) return;

      const formData = new FormData(event.currentTarget);
      const lookupButton = document.getElementById('lookupButton');
      const resultArea = document.getElementById('resultArea');

      lookupButton.disabled = true;
      lookupButton.textContent = '조회 중...';
      resultArea.innerHTML = '<div class="hint">주문 내역을 조회하고 있습니다.</div>';

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/lookup-guest-orders`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({
            tenantId: TENANT_ID,
            buyerName: String(formData.get('buyerName') || '').trim(),
            buyerPhone: String(formData.get('buyerPhone') || '').trim(),
          }),
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) {
          throw new Error(result.error || result.message || '주문 조회에 실패했습니다.');
        }

        renderOrders(result.orders || []);
      } catch (error) {
        resultArea.innerHTML = `<div class="error">주문 조회 중 오류가 발생했습니다.<br />${error.message}</div>`;
      } finally {
        lookupButton.disabled = false;
        lookupButton.textContent = '조회하기';
      }
    });
  </script>
</body>

</html>
